name: Supabase keep-alive

# Free-tier Supabase pauses the database after 7 days of inactivity.
# Ping the REST endpoint twice a week to keep it awake.
on:
  schedule:
    - cron: "0 1 * * 1,4" # Mon & Thu 01:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL secret not set; skipping." && exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/trips?select=id&limit=1")
          echo "HTTP $code"
          case "$code" in
            200|206) exit 0 ;;
            *) echo "Keep-alive ping failed" && exit 1 ;;
          esac
